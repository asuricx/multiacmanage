services:
  postgres:
    image: postgres:16-alpine
    container_name: userbot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-userbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-userbot_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-userbot_db}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-userbot} -d ${POSTGRES_DB:-userbot_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - userbot_network

  redis:
    image: redis:7-alpine
    container_name: userbot_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - userbot_network

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: userbot_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-userbot}:${POSTGRES_PASSWORD:-userbot_secret_password}@postgres:5432/${POSTGRES_DB:-userbot_db}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app
    networks:
      - userbot_network

volumes:
  postgres_data:
    name: userbot_postgres_data
  redis_data:
    name: userbot_redis_data

networks:
  userbot_network:
    name: userbot_network
    driver: bridge
